services:
  web:
    image: python:3.12-slim
    container_name: iac-web
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - IAC_LLM_BACKEND=ollama
      - IAC_OLLAMA_BASE_URL=http://ollama:11434
      - IAC_OLLAMA_MODEL=${IAC_OLLAMA_MODEL:-llama3.1}
      - IAC_OLLAMA_EMBED_MODEL=${IAC_OLLAMA_EMBED_MODEL:-nomic-embed-text}
      - IAC_LLM_TIMEOUT_S=${IAC_LLM_TIMEOUT_S:-180}
    ports:
      - "8000:8000"
    depends_on:
      - ollama
      - ollama-pull
    command:
      - sh
      - -lc
      - |
        set -eu
        pip install -r requirements.txt -r requirements-web.txt
        python backend/manage.py migrate
        python backend/manage.py runserver 0.0.0.0:8000

  ollama:
    image: ollama/ollama:latest
    container_name: iac-ollama
    ports:
      - "${IAC_OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-5m}
      # Ensure the Ollama server binds to the container network interface.
      - OLLAMA_HOST=0.0.0.0:11434
    restart: unless-stopped
    command:
      - serve

  ollama-pull:
    image: ollama/ollama:latest
    entrypoint:
      - sh
      - -lc
    volumes:
      - ollama:/root/.ollama
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    restart: on-failure
    command:
      - |
        set -eu
        ollama pull "${IAC_OLLAMA_MODEL:-llama3.1}"
        ollama pull "${IAC_OLLAMA_EMBED_MODEL:-nomic-embed-text}"

volumes:
  ollama:
