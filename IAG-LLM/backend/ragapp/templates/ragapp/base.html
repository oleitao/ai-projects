{% load static %}
<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}IAC RAG{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="{% static 'ragapp/app.css' %}" />
    {% block head %}{% endblock %}
  </head>
  <body class="bg-body-tertiary">
    <nav class="navbar navbar-expand-lg bg-body shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="{% url 'home' %}">IAC RAG</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#topNav"
          aria-controls="topNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="topNav">
          <div class="navbar-nav ms-auto">
            <a
              class="nav-link {% if request.path == '/' %}active{% endif %}"
              {% if request.path == '/' %}aria-current="page"{% endif %}
              href="{% url 'home' %}"
            >Inicio</a>
            <a
              class="nav-link {% if request.path|slice:':7' == '/ingest' %}active{% endif %}"
              {% if request.path|slice:':7' == '/ingest' %}aria-current="page"{% endif %}
              href="{% url 'ingest' %}"
            >Ingestão</a>
            <a
              class="nav-link {% if request.path|slice:':5' == '/chat' %}active{% endif %}"
              {% if request.path|slice:':5' == '/chat' %}aria-current="page"{% endif %}
              href="{% url 'chat' %}"
            >Chat</a>
          </div>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-{{ message.tags|default:'secondary' }} mb-3" role="alert">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}

      {% block content %}{% endblock %}

      <footer class="pt-4 mt-4 border-top text-muted small">
        <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center">
        </div>
      </footer>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
