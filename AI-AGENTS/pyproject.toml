[project]
name = "ai-agents-terraform"
version = "0.1.0"
description = "Pipeline multi-agente para geração e validação de infraestrutura Terraform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
langgraph = [
  "langchain-core>=0.3.0",
  "langgraph>=0.2.0",
]

[project.scripts]
infra-agents = "infra_agents.cli:main"
infra-agents-api = "infra_agents.api:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["infra_agents*"]
